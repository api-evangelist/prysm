aid: prysm
name: Prysm
description: >-
  Prysm — legally Motherson Prysm, Inc. — builds large-format interactive display hardware and the
  Prysm Application Suite, a cloud-hosted visual collaboration and digital-workplace platform.
  Founded in 2005 in Silicon Valley as Spudnik by Amit Jain and Roger Hajjar, the company invented and
  patented Laser Phosphor Display (LPD) technology, shipped today as the bezel-free LPD 6K Series
  single-panel display (up to 225 inches) alongside an 85-inch LCD room solution. In 2014 Prysm merged
  with Anacore to add a multi-source interactive canvas, producing a platform that combines digital
  whiteboarding, on-screen annotation, co-browsing, device sharing and Teams/Zoom/Webex launching
  across web, desktop and iPhone clients for customer experience centers, executive boardrooms and
  huddle rooms. Prysm became part of the Motherson Group in 2025. Prysm announced an early preview of
  a "Prysm API" for custom applications on its digital workplace platform in June 2017, but publishes
  no developer portal, API reference, or machine-readable specification today.
